[project]
name = "copier-python-project"
version = "0.0.0"
description = "Tests of the copier-python-project Copier template (not a package)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "copier>=9.4.0",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 89

[tool.pytest.ini_options]
testpaths = ["tests"]
