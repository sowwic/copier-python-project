# Copier template: Python project (library, Qt widgets app or QML app)
# Use: copier copy --trust gh:sowwic/copier-python-project path/to/new-project
# Update an existing project: copier update --trust   (needs a clean git tree)
_subdirectory: template
_min_copier_version: "9.4.0"

# Tasks only run with --trust:
#  - fetch the shared makefile modules into .make/ (sowwic/makefiles), so they can be committed
#  - `uv lock` makes the lockfile CI needs (`uv sync --locked`); skipped when uv is missing
_tasks:
  - "make help >/dev/null 2>&1 || echo 'Could not fetch .make/*.mk from sowwic/makefiles, make fetches them on the first run.'"
  - "command -v uv >/dev/null 2>&1 && uv lock || true"

# Shown after copying: how to turn the folder into the GitHub repo
_message_after_copy: |
  {{ project_name }} is ready. To create the GitHub repo (main + develop, default develop, standard rulesets):

    cd {{ _copier_conf.dst_path }}
    make init-repo        # add REPO_FLAGS=--private for a private repo

project_name:
  type: str
  help: Project name (human readable, used in titles, docs and the app name)
  default: My Project

project_slug:
  type: str
  help: Project slug (repo/directory name and distribution name on PyPI)
  default: "{{ project_name.lower().replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z0-9][a-z0-9._-]*$')) %}
    must be lowercase letters, digits, '.', '_' or '-'
    {% endif %}

package_name:
  type: str
  help: Python package name (the importable module under src/)
  default: my_package

package_slug:
  type: str
  help: Package slug (normalized import name, must be a valid identifier)
  default: "{{ package_name.lower().replace(' ', '_') }}"
  validator: >-
    {% if not package_slug.isidentifier() %}
    is not a valid Python identifier
    {% endif %}

initial_version:
  type: str
  help: Initial version (written to VERSION, pyproject.toml and CHANGELOG.rst)
  default: 1.0.0

python_version:
  type: str
  help: Minimum Python version (requires-python and CI test version)
  default: "3.14"

pin_python_version:
  type: bool
  help: Pin the Python version for local development? (adds .python-version with the minimum version, which uv uses for the virtual environment)
  default: true

project_type:
  type: str
  help: What kind of project is this?
  default: library
  choices:
    "Plain Python library/package (no GUI)": library
    "Qt (PySide6) widgets application, with resources and offscreen Qt CI": qt_app
    "Qt application with a QML UI (adds qml/ folder and qmlls config script)": qml_app

bundle_app:
  type: bool
  help: Bundle as a standalone app with PyInstaller? (adds PyInstaller, .spec file and `make bundle`)
  default: false
  when: "{{ project_type in ['qt_app', 'qml_app'] }}"

macos_app:
  type: bool
  help: Build a macOS .app bundle? (adds the .app bundle to the spec, `make iconset` and `make install`)
  default: false
  when: "{{ bundle_app }}"

publish_to_pypi:
  type: bool
  help: Publish to PyPI? (adds `make pypi-publish` and `make pypi-publish-dev` for TestPyPI, and project URLs)
  default: false

pypi_name:
  type: str
  help: Project name on PyPI (the `name` in pyproject.toml, what users `pip install`)
  default: "{{ project_slug }}"
  when: "{{ publish_to_pypi }}"
  validator: >-
    {% if not (pypi_name | regex_search('^[A-Za-z0-9][A-Za-z0-9._-]*$')) %}
    must be letters, digits, '.', '_' or '-'
    {% endif %}

author:
  type: str
  help: Author name (pyproject.toml, LICENSE, docs)
  default: Dima Shevchenko

author_email:
  type: str
  help: Author email (pyproject.toml)
  default: 47799401+sowwic@users.noreply.github.com

github_user:
  type: str
  help: GitHub user or organization (README badges and links)
  default: sowwic

github_workflow:
  type: bool
  help: Include GitHub Actions workflows (tests, lint, docs, release) from sowwic/gh-workflows?
  default: true

release_branch:
  type: str
  help: Release branch (CI, docs deploy and `make release` use it)
  default: main

develop_branch:
  type: str
  help: Development branch (CI and `make release` back-merge target)
  default: develop

ide:
  type: str
  help: Which editor/IDE should get project config (debugger, env file)?
  default: nvim
  choices:
    "Neovim: .nvim.lua with nvim-dap (debugpy) configurations": nvim
    "VS Code: .vscode/ settings": vscode
    "Zed: .zed/debug.json (Qt projects only)": zed
    "None: no editor-specific files": none

# Computed, not asked and not saved in the answers file.
is_qt:
  type: bool
  when: false
  default: "{{ project_type in ['qt_app', 'qml_app'] }}"

is_qml:
  type: bool
  when: false
  default: "{{ project_type == 'qml_app' }}"

dist_name:
  type: str
  when: false
  default: "{{ pypi_name if publish_to_pypi else project_slug }}"

bundle:
  type: bool
  when: false
  default: "{{ is_qt and bundle_app }}"

macos:
  type: bool
  when: false
  default: "{{ bundle and macos_app }}"
